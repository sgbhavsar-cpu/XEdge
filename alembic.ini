[alembic]
script_location = xedge/fleet/migrations

; A developer running `alembic revision --autogenerate` from a checkout
; needs a real database to diff against — this default matches
; deploy/docker/docker-compose.fleet.yml's postgres service. Never read
; in production: xedge.fleet.migrate.run_migrations builds its own
; Config with the deployment's real --database-url instead.
sqlalchemy.url = postgresql+asyncpg://xedge:xedge@localhost:5432/xedge_fleet

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
