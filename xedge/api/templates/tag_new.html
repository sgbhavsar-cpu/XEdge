{% extends "config_layout.html" %}
{% block title %}xEdge — Add Tag{% endblock %}
{% block config_content %}
<div class="xedge-card">
  <h1>Add tag to {{ group_id }}</h1>
  {% if error %}<p class="xedge-error">{{ error }}</p>{% endif %}
  <form method="post" action="/ui/config/drivers/{{ driver_id }}/tag-groups/{{ group_id }}/tags/new">
    <div class="xedge-field">
      <label for="id">Tag ID</label>
      <input type="text" id="id" name="id" value="{{ id_value }}" required autofocus>
    </div>
    <div class="xedge-form-actions">
      <button type="submit">Create</button>
      <a href="/ui/config/drivers/{{ driver_id }}/tag-groups/{{ group_id }}" class="xedge-button-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
