[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xedge"
version = "0.1.0"
description = "xEdge — enterprise-grade, multi-protocol IIoT edge software stack"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later OR Commercial" }
authors = [{ name = "xEdge Project" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "structlog>=24.1",
    "pyserial-asyncio>=0.6",
    # Already present as a transitive dependency of pyserial-asyncio above;
    # declared explicitly since Sprint C3 (XEDGE-434) — xedge.api.server's
    # serial-port auto-detection endpoint imports serial.tools.list_ports
    # directly.
    "pyserial>=3.5",
    "paho-mqtt>=2.1",
    # MVP OPC UA runtime (ADR-006 §7 amendment) — GPL edition only until
    # LGPL-3.0 obligations are reviewed for the commercial edition; the
    # open62541 C-extension binding remains the ADR-006 §3 target.
    "asyncua>=1.1",
    # BACnet/IP client runtime (ADR-006 "buy" decision, Sprint 21/XEDGE-160):
    # MIT-licensed, pure Python, no required transitive deps — unlike the
    # in-house clean-room protocol stacks, this is a direct library
    # integration rather than a from-spec build.
    "bacpypes3>=0.0.100",
    # Self-signed server certificate generation for the Web UI/REST API
    # (Sprint 13, XEDGE-107) — already present as a transitive dependency;
    # declared explicitly since xedge.api.tls imports it directly.
    "cryptography>=42.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    # Distributed tracing/metrics (Sprint 16, XEDGE-126/128). OTLP over
    # HTTP, not gRPC: the gRPC exporter drags in `grpcio`, a heavy
    # C-extension with real cross-compilation cost, working against
    # ADR-007's 1GB-RAM ARM target — HTTP carries the same OTLP protocol
    # over `requests` (already a transitive dependency of asyncua).
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-exporter-prometheus>=0.48b0",
    # Diagnostic WebSocket server (Sprint 17, XEDGE-133) + xedge-cli's WS
    # client. Already present transitively via uvicorn's WS transport, but
    # not declared — pin it explicitly so a clean install doesn't rely on
    # that happening by luck.
    "websockets>=12",
    # xedge-cli (Sprint 17, XEDGE-140) and the fleet agent (Sprint 29,
    # XEDGE-210) both make outbound HTTP calls from production code — this
    # was previously only declared under the `test` extra (an existing gap,
    # unrelated to fleet work, found while adding a second real consumer).
    "httpx>=0.27",
    # Embedded MQTT broker (Sprint C5, XEDGE-453; ADR-012 §3). Explicitly
    # promoted from test-only, reversing that prior decision in the open —
    # see docs/planning/license-audit.md §4 item 6 for the license/
    # maintenance/ARM-footprint re-verification (prerequisite P-5) this
    # promotion required first. Still also the test-only broker fixture's
    # dependency (ADR-006) — that role is unaffected, just no longer the
    # only reason this package is installed.
    "amqtt>=0.11",
    # EtherNet/IP (CIP) scanner runtime (Sprint C7, XEDGE-471; ADR-012 §1):
    # MIT-licensed, zero runtime dependencies of its own — see
    # docs/planning/license-audit.md §4 item 7 for the license/maintenance
    # verification this integration required first (prerequisite P-1),
    # including its "no longer actively developed" PyPI notice.
    "pycomm3>=1.2",
    # SNMP manager runtime (Sprint C8, XEDGE-481; ADR-012 §2): BSD-2-Clause,
    # one dependency of its own (pyasn1, also BSD-2-Clause) — see
    # docs/planning/license-audit.md §4 item 8 for the license/maintenance/
    # agent-role verification this integration required first
    # (prerequisites P-3/P-4), including the PyPI naming-fragmentation
    # finding (pysnmp-lextudio is deprecated in favor of plain pysnmp).
    "pysnmp>=7.1",
    # Fleet Manager registry, Postgres migration (Sprint P1, XEDGE-500;
    # ADR-013 §5): SQLAlchemy 2.0's async ORM + asyncpg — asyncpg rather
    # than psycopg because it needs no libpq C library at all (a from-
    # scratch protocol implementation), matching the same "avoid a second
    # system dependency on the 1GB-RAM ARM target" reasoning already
    # applied to the OTLP exporter choice above. Alembic owns schema
    # versioning (XEDGE-501) — see xedge/fleet/migrations/.
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
]

[project.optional-dependencies]
# The dev toolchain is PINNED, not floored (Sprint 0, XEDGE-401). Lint and
# type-check results are version-dependent: with `>=` floors, a new ruff or
# mypy release turns CI red with no code change — which is exactly what
# happened between 2026-07-08 and 2026-07-26 (29 new ruff violations and 15
# new mypy errors appeared with no commit in between). Bump these
# deliberately, in their own PR, with the resulting findings fixed.
dev = [
    "ruff==0.16.0",
    "mypy==2.3.0",
    "bandit==1.9.4",
    "types-PyYAML==6.0.12.20260724",
    "types-jsonschema==4.26.0.20260518",
    "types-pyserial==3.5.0.20260712",
]
test = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    # A hung test is otherwise a hung CI job with no traceback (see the
    # XEDGE-CRD-001 Delivery 1 merge notes for two real incidents this
    # would have caught immediately instead of costing hours of Docker
    # reproduction each) — one slow/stuck test should fail loudly, not
    # block every other test behind it. `timeout` in [tool.pytest.ini_options]
    # is generous relative to this suite's actual per-test cost (a small
    # fraction of a second; the full suite runs in ~2.5 minutes).
    "pytest-timeout>=2.3",
    # Black-box test oracles / test-only infrastructure (ADR-006) — never
    # imported by xedge itself, never read as reference implementations,
    # not shipped in any edition.
    "pymodbus>=3.6",
    # amqtt itself moved to the main runtime dependencies list above
    # (Sprint C5, XEDGE-453) -- it's still used as the test-only broker
    # fixture too (tests/fixtures/mqtt_broker.py), just no longer *only*
    # that, so it no longer belongs exclusively under this extra.
    # pysparkplug is installed separately with --no-deps (see CI workflow /
    # README): its own pin of paho-mqtt<2 conflicts with our real paho-mqtt
    # 2.x dependency above, but we only use its payload decode classes,
    # which don't touch its MQTT client at all.
    #
    # aiosmtpd (Sprint C6, XEDGE-466): real local SMTP server for
    # xedge.core.smtp's tests -- the same test-oracle role pymodbus/amqtt
    # play, needed because Python 3.12 removed the stdlib `smtpd` module
    # this would otherwise have used. Apache-2.0; deps attrs (MIT) and
    # atpublic (Apache-2.0) both checked too.
    "aiosmtpd>=1.4",
    # Real Postgres for the Fleet Manager registry's tests (Sprint P1,
    # XEDGE-500/503) -- the same "test against the real server, not a
    # mock" posture as pymodbus/amqtt/aiosmtpd above, but Postgres can't
    # be embedded in-process the way those are, so this spins up a real
    # `postgres:16-alpine` container instead (see tests/fixtures/postgres.py).
    # >=4.15 pinned as a floor: that's the first version verified to expose
    # `testcontainers.community.postgres` (the pre-4.15 `testcontainers.
    # postgres` import path still works but is deprecated). Needs a Docker
    # daemon reachable from wherever `pytest` runs -- true for GitHub
    # Actions' ubuntu-latest runners out of the box, so no ci.yml changes
    # were needed for this.
    "testcontainers[postgres]>=4.15",
]

[project.scripts]
xedge = "xedge.core.main:run"
xedge-cli = "xedge.cli.client:run"
xedge-fleet-manager = "xedge.fleet.manager_cli:run"

[tool.hatch.build.targets.wheel]
packages = ["xedge"]

# Bundles the repo's canonical config/schema/ (published per IR-SW-004, used
# by IDE plugins and external validators) into the installed package so the
# runtime default schema path resolves after a real (non-editable) install —
# see xedge.core.main._default_schema_path.
[tool.hatch.build.targets.wheel.force-include]
"config/schema" = "xedge/schema"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Method is left unset: pytest-timeout defaults to "signal" on Linux/macOS
# (raises inside whatever is actually stuck, with a real traceback through
# the await chain) and falls back to "thread" automatically on Windows
# (no SIGALRM there), where this suite is also run locally.
timeout = 60

[tool.coverage.run]
source = ["xedge"]
omit = ["*/tests/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# fastapi.Form/Depends/Query/etc. are exempted from B008 by ruff's default
# allowlist already; fastapi.File isn't (as of ruff 0.15), even though it's
# the same "evaluated once at import time by FastAPI's DI system" pattern.
extend-immutable-calls = ["fastapi.File"]

[tool.mypy]
python_version = "3.11"
platform = "linux"
strict = true
warn_unused_ignores = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = "serial_asyncio.*"
ignore_missing_imports = true

# bacpypes3 ships no py.typed marker and no stubs (as of 0.0.10x), so every
# `from bacpypes3.* import ...` in the BACnet driver is an import-untyped
# error under --strict. Same treatment as serial_asyncio above: the driver
# itself stays strictly typed, only the third-party surface is untyped.
[[tool.mypy.overrides]]
module = "bacpypes3.*"
ignore_missing_imports = true

# amqtt (embedded MQTT broker, Sprint C5/XEDGE-453) and passlib (its password
# hashing dependency, used directly for the broker's password file) ship no
# py.typed marker either. Same treatment as above.
[[tool.mypy.overrides]]
module = ["amqtt.*", "passlib.*"]
ignore_missing_imports = true

# pysnmp (SNMP manager, Sprint C8/XEDGE-481) ships no py.typed marker either
# (confirmed: no py.typed file in the installed package). Same treatment.
[[tool.mypy.overrides]]
module = "pysnmp.*"
ignore_missing_imports = true
