[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xedge"
version = "0.1.0"
description = "xEdge — enterprise-grade, multi-protocol IIoT edge software stack"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later OR Commercial" }
authors = [{ name = "xEdge Project" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "structlog>=24.1",
    "pyserial-asyncio>=0.6",
]

[project.optional-dependencies]
northbound = [
    "paho-mqtt>=2.1",
]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "types-PyYAML",
    "types-jsonschema",
]
test = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    # Black-box test oracles only (ADR-006) — never imported by xedge itself,
    # never read as a reference implementation, not shipped in any edition.
    "pymodbus>=3.6",
]

[project.scripts]
xedge = "xedge.core.main:run"

[tool.hatch.build.targets.wheel]
packages = ["xedge"]

# Bundles the repo's canonical config/schema/ (published per IR-SW-004, used
# by IDE plugins and external validators) into the installed package so the
# runtime default schema path resolves after a real (non-editable) install —
# see xedge.core.main._default_schema_path.
[tool.hatch.build.targets.wheel.force-include]
"config/schema" = "xedge/schema"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["xedge"]
omit = ["*/tests/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
platform = "linux"
strict = true
warn_unused_ignores = true
exclude = ["tests/"]
