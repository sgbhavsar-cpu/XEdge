# Fleet Manager deployment (Sprint 29, XEDGE-215; reworked Sprint C4,
# XEDGE-440/442/443; Postgres migration Sprint P1, XEDGE-500/501; user
# accounts/RBAC Sprint P2, XEDGE-502) — a separate service from any
# individual xEdge device (ADR-009, Sprint 32's documented split), built
# from the same image as the device's own Dockerfile since the fleet code
# ships inside the same `xedge` wheel (just a different console-script
# entrypoint). The device registry is Postgres-backed as of XEDGE-500
# (ADR-013 §5 supersedes ADR-009 §4 for the central server only — a
# device's own local store stays SQLite).
#
# Usage: docker compose -f deploy/docker/docker-compose.fleet.yml up
#
# Serves two ports (ADR-013 §3/§4; xedge/fleet/manager_cli.py):
#   - 8090: login, join-token provisioning, device enrollment, and admin
#     calls. Server-TLS only, using a certificate the manager's own fleet
#     CA issues to itself on first run.
#   - 8091: heartbeat and certificate rotation for already-enrolled
#     devices. mTLS — the TLS handshake itself rejects any connection not
#     presenting a certificate the fleet CA issued.
#
# There is no admin_token anymore (XEDGE-502): a bootstrap "admin" account
# is created on first run, with an auto-generated password persisted into
# the `fleet-manager-data` volume. Log in to get a session token, then
# create named accounts for real operators and change the bootstrap
# password. There is no manager-wide join_token either: join tokens are
# single-use and scoped to one device_id, created through the admin API.
# To enroll a device:
#   docker compose -f deploy/docker/docker-compose.fleet.yml exec \
#     fleet-manager cat /data/admin_bootstrap_password
#   SESSION_TOKEN=$(curl -sk -X POST https://localhost:8090/api/v1/fleet/auth/login \
#     -H "Content-Type: application/json" \
#     -d '{"tenant_name": "default", "username": "admin", "password": "<bootstrap password>"}' \
#     | python3 -c "import sys, json; print(json.load(sys.stdin)['session_token'])")
#   curl -sk -X POST https://localhost:8090/api/v1/fleet/join-tokens \
#     -H "Authorization: Bearer $SESSION_TOKEN" \
#     -H "Content-Type: application/json" \
#     -d '{"device_id": "<device_id>"}'
# The device's own fleet.join_token config field takes the resulting
# one-time token; xedge/fleet/agent.py handles the CSR/enrollment exchange.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: xedge
      POSTGRES_PASSWORD: xedge
      POSTGRES_DB: xedge_fleet
    volumes:
      - fleet-manager-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xedge"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  fleet-manager:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    entrypoint: ["xedge-fleet-manager"]
    command:
      [
        "--data-dir", "/data",
        "--database-url", "postgresql+asyncpg://xedge:xedge@postgres:5432/xedge_fleet",
        "--host", "0.0.0.0",
        "--port", "8090",
        "--device-port", "8091",
      ]
    ports:
      - "8090:8090"
      - "8091:8091"
    volumes:
      - fleet-manager-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl, urllib.request; urllib.request.urlopen('https://127.0.0.1:8090/health', timeout=5, context=ssl._create_unverified_context())"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  fleet-manager-data:
  fleet-manager-postgres-data:
