name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint + Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,test]"
      - run: ruff check xedge tests
      - run: ruff format --check xedge tests
      - run: mypy xedge
      - run: bandit -r xedge -q

  unit-tests:
    name: Unit + Integration Tests (amd64)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,test]"
      # pysparkplug pins paho-mqtt<2, conflicting with our real paho-mqtt 2.x
      # dependency; installed separately since we only use its payload-decode
      # classes as a black-box oracle (ADR-006), never its MQTT client.
      - run: pip install --no-deps "pysparkplug>=0.6"
      - run: pytest tests/ --cov=xedge --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: coverage-xml
          path: coverage.xml

  security-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,test]" pip-audit
      - run: pip-audit --strict
        continue-on-error: true # tighten to blocking once a baseline is established (SR-VM-001)

  frontend:
    name: Frontend Lint + Typecheck + Test + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm run test
      - working-directory: frontend
        run: npm run build
      # Blocking from day one (XEDGE-514, ADR-013 §6's own accepted
      # consequence) -- unlike pip-audit above, there's no pre-existing
      # npm tree to grandfather a violation backlog against. The one
      # currently known finding (an RSC-mode-specific react-router
      # advisory this SPA doesn't use) is an explicit, documented
      # exception in frontend/audit-ci.jsonc, not silently ignored here.
      - working-directory: frontend
        run: npm run audit

  bacnet-mstp-daemon:
    name: BACnet MS/TP Daemon Build (XEDGE-166)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the only job needing third_party/bacnet-stack's actual content
          # -- every other job leaves the submodule unfetched (checkout@v4
          # default), which is fine since testpaths=["tests"] means pytest
          # never scans it either.
          submodules: recursive
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential socat
      - working-directory: xedge/drivers/bacnet/mstp_daemon
        run: make
      # XEDGE-171: the deterministic test-double server used by
      # test_bacnet_mstp_real_daemon.py -- built here (not in unit-tests)
      # for the same reason the daemon itself is: both need the submodule
      # actually fetched.
      - working-directory: tests/fixtures/mstp_test_server
        run: make
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,test]"
      - run: pytest tests/integration/test_bacnet_mstp_real_daemon.py -v

  docker-build:
    name: Docker Build (amd64, arm64, armv7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
