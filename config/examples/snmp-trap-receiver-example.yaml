# SNMP TRAP/INFORM receiver (Sprint C8, XEDGE-484): a driver instance that
# listens for inbound notifications from a field device and maps the
# varbind OIDs it cares about to tags -- event-driven, not polled (there
# is no scan_rate_ms; a tag's value only updates when a matching
# notification actually arrives).
schema_version: "0.1"

data_dir: /data

logging:
  level: INFO

watchdog:
  enabled: true
  interval_seconds: 15

drivers:
  - id: snmp_traps_from_ups
    type: snmp_trap_receiver
    enabled: true
    config:
      host: 0.0.0.0
      port: 162
      version: v2c
      community: "${SECRET:snmp_trap_receiver_community}"
    tag_groups:
      - id: ups_events
        tags:
          - id: ups_battery_status
            trap_oid: "1.3.6.1.4.1.12345.2.1.1" # vendor-specific OID from the UPS's own MIB
          - id: ups_load_percent
            trap_oid: "1.3.6.1.4.1.12345.2.1.2"
            engineering_unit: "%"

store:
  ram_max_depth: 10000
  retention_duration_seconds: 604800 # 7 days
  purge_interval_seconds: 3600

config_management:
  hot_reload_enabled: true
  poll_interval_seconds: 2.0
  max_versions: 10

api:
  enabled: true
  host: 127.0.0.1
  port: 8080
