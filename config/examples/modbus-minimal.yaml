# Minimal xEdge configuration — core config with no active drivers.
# Disabled so `xedge --config` starts cleanly without a reachable device;
# see modbus-tcp-example.yaml for a fully configured, enabled driver.
schema_version: "0.1"

logging:
  level: INFO

watchdog:
  enabled: true
  interval_seconds: 15

drivers:
  - id: modbus_tcp_01
    type: modbus_tcp
    enabled: false
