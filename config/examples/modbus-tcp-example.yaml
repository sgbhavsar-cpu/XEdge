# Fully configured Modbus TCP driver reading from a PLC at 192.168.1.100,
# publishing northbound as Sparkplug B over MQTT to a broker at
# 192.168.1.10:1883. Update both hosts to reachable endpoints (or test
# doubles — see tests/fixtures/fake_modbus_server.py and amqtt) before
# enabling this in a real deployment. TLS/mTLS (SR-TS-001/002) lands in
# Sprint 13; this connects in plaintext.
schema_version: "0.1"

# Root for all persistent state (Sprint 0, XEDGE-402). Every other
# persistent path defaults to a subdirectory of this one.
data_dir: /data

logging:
  level: INFO

watchdog:
  enabled: true
  interval_seconds: 15

drivers:
  - id: modbus_tcp_01
    type: modbus_tcp
    enabled: true
    config:
      host: 192.168.1.100
      port: 502
      unit_id: 1
      connect_timeout_seconds: 5
      read_timeout_seconds: 3
    tag_groups:
      - id: analog_inputs
        scan_rate_ms: 1000
        deadband:
          type: percentage
          value: 0.5
        tags:
          - id: temperature_01
            function_code: read_holding_registers
            address: 0
            scaling:
              scale: 0.1
              offset: -273.15
            engineering_unit: "°C"
          - id: pressure_01
            function_code: read_input_registers
            address: 0
      - id: digital_inputs
        scan_rate_ms: 500
        tags:
          - id: pump_running
            function_code: read_coils
            address: 0
          - id: door_open
            function_code: read_discrete_inputs
            address: 0

northbound:
  enabled: true
  publish_interval_seconds: 1.0
  mqtt:
    host: 192.168.1.10
    port: 1883
    group_id: factory1
    edge_node_id: edge01
    qos: 1

store:
  # directory: defaults to <data_dir>/store; set it only to split
  # telemetry onto a different volume from the rest of the state.
  ram_max_depth: 10000
  retention_duration_seconds: 604800 # 7 days
  purge_interval_seconds: 3600

config_management:
  hot_reload_enabled: true
  poll_interval_seconds: 2.0
  # history_directory: defaults to <data_dir>/config-history
  max_versions: 10

api:
  enabled: true
  host: 127.0.0.1 # loopback-only until the API has auth (FR-CM-003)
  port: 8080
